ذا لم تُفتح صمامات المانيفولد بعد 180 ثانية من تشغيل المضخة، تتوقف المضخة تلقائياً."}, {"id": "3", "title": "ملاحظة 3", "text": "إذا ظهرت إشارة التشغيل بعد 10 ثوانٍ من أمر الإيقاف، فهذا شرط إيقاف للمضخة."}, {"id": "4", "title": "ملاحظة 4", "text": "بعد 200 ثانية (قيمة قابلة للتعديل) وقبل إيقاف المضخة، يجب أن يكون المشغّل قد أغلق جميع صمامات التسلسل، وإلا يظهر إنذار TRANSFER SEQUENCE NOT FINISHED."}, {"id": "general", "title": "ملاحظة عامة", "text": "عند عمل مضخة واحدة يجب أن يكون صمام سحب خزان واحد فقط مفتوحاً (المضخة الواحدة مرتبطة بخزانين فقط). إذا فُتح صمام آخر، يوقف الـ PLC المضخة تلقائياً ويغلق جميع صمامات الدائرة."}, {"id": "safety", "title": "تنبيه أمان", "text": "أثناء التشغيل يجب عدم فتح صفحات البرنامج (السيرفر) بصورة عشوائية، لأن ذلك يؤدي إلى امتلاء ذاكرة كرت الشاشة (Graphics) والخروج المفاجئ من البرنامج."}]};
const PHASES={prepare:{name:'تهيئة ما قبل التشغيل',desc:'التحقق من جاهزية المعدات ولوحات السيطرة',steps:DATA.prepare},run:{name:'التشغيل والتصدير',desc:'من وضع REMOTE إلى نقل المنتج للمانيفولد',steps:DATA.run},stop:{name:'إيقاف المضخة',desc:'إعادة التدوير وإنهاء تسلسل الإيقاف',steps:DATA.stop}};
const TOTAL=DATA.prepare.length+DATA.run.length+DATA.stop.length;
let state={phase:'prepare',index:0,done:new Set(JSON.parse(localStorage.getItem('ph04-done')||'[]')),view:'steps',pairMode:'run',pairIndex:0};
function save(){localStorage.setItem('ph04-done',JSON.stringify([...state.done]));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function allDone(){return state.done.size}
function tag(site){return `<span class="tag ${site?'site':''}">${site?'● إضافة موقعية':'● النص الأصلي'}</span>`}
function header(){return `<header class="top"><a href="#" class="brand" onclick="home();return false"><div class="logo">PH<br><small>04</small></div><div><b>دليل المضخة PH04</b><small>INTERACTIVE OPERATION GUIDE</small></div></a><div class="top-actions"><button class="btn" onclick="show('notes')">الملاحظات</button><button class="btn" onclick="show('pairs')">أزواج الموائمة</button><button class="btn" onclick="resetProgress()">إعادة ضبط التقدم</button></div></header>`}
function nav(){return `<div class="tabs"><button class="tab ${state.view==='home'?'active':''}" onclick="home()">نظرة عامة</button><button class="tab ${state.view==='steps'&&state.phase==='prepare'?'active':''}" onclick="go('prepare')">التهيئة (${DATA.prepare.length})</button><button class="tab ${state.view==='steps'&&state.phase==='run'?'active':''}" onclick="go('run')">التشغيل والتصدير (${DATA.run.length})</button><button class="tab ${state.view==='steps'&&state.phase==='stop'?'active':''}" onclick="go('stop')">الإيقاف (${DATA.stop.length})</button><button class="tab ${state.view==='pairs'?'active':''}" onclick="show('pairs')">الجداول</button><button class="tab ${state.view==='notes'?'active':''}" onclick="show('notes')">التنبيهات</button></div>`}
function home(){state.view='home';render();}
function go(phase,index=0){state.phase=phase;state.index=index;state.view='steps';render();}
function show(view){state.view=view;render();}
function stepsPanel(){let list=PHASES[state.phase].steps;return `<aside class="panel"><h2>تسلسل الخطوات · ${list.length}</h2>${list.map((s,i)=>`<button class="step-link ${i===state.index?'selected':''} ${state.done.has(s.id)?'done':''}" onclick="go('${state.phase}',${i})"><span class="step-no">${state.done.has(s.id)?'✓':esc(s.sourceNumber)}</span><span>${esc(s.title)}</span></button>`).join('')}</aside>`}
function stepView(){let p=PHASES[state.phase],s=p.steps[state.index],done=state.done.has(s.id),count=p.steps.filter(x=>state.done.has(x.id)).length;let safety=state.phase!=='prepare'?`<div class="notice safety"><b>⚠</b><span><strong>تنبيه أمان من المصدر:</strong> ${esc(DATA.notes.find(n=>n.id==='safety').text)}</span></div>`:'';let refs=s.notes.map(id=>DATA.notes.find(n=>n.id===id)).filter(Boolean).map(n=>`<div class="notice"><b>!</b><span><strong>${esc(n.title)}</strong><br>${esc(n.text)}<br><button class="btn" onclick="showNote('${n.id}')">عرض الملاحظة</button></span></div>`).join('');let pair=(state.phase==='run'&&s.number>=25&&s.number<=28)||(state.phase==='stop'&&s.number<=4);return `<div class="heading"><div><div class="eyebrow">المسار ${state.phase==='prepare'?'01':state.phase==='run'?'02':'03'} / ${state.phase==='prepare'?'إضافة موقعية':'الإجراء الأصلي'}</div><h2>${p.name}</h2><p>${p.desc}</p></div><span class="tag">${count} / ${p.steps.length} منجزة</span></div><div class="meter"><i style="width:${count/p.steps.length*100}%"></i></div><div class="layout">${stepsPanel()}<main class="content">${safety}<section class="card step-card"><div class="heading"><span class="muted">الخطوة <b>${esc(s.sourceNumber)}</b> من ${p.steps.length}</span>${tag(s.site)}</div><h3>${esc(s.title)}</h3><div class="source">${esc(s.text)}</div>${s.addition?`<div class="addition"><b>إيعاز موائمة مضاف · إضافة موقعية</b><br>${esc(s.addition)}</div>`:''}${s.seconds?`<div class="notice"><b>⏱</b><span>تأخير ${s.seconds} ثانية كما ورد في المصدر. هذا المؤقت إرشادي فقط وليس مؤقت PLC.</span></div>`:''}${refs}${pair?`<div class="notice safety"><b>↔</b><span>هذه الخطوة مرتبطة بجدول أزواج الموائمة. <button class="btn" onclick="show('pairs');state.pairMode='${state.phase}';render()">فتح الجدول</button></span></div>`:''}<button class="btn confirm ${done?'checked':'primary'}" onclick="toggleDone('${s.id}')">${done?'✓ الخطوة مؤكدة — إلغاء التأكيد':'○ تأكيد إنجاز هذه الخطوة'}</button><div class="nav"><button class="btn" ${state.index===0?'disabled':''} onclick="go('${state.phase}',${state.index-1})">السابق</button><span class="muted">${state.index+1} / ${p.steps.length}</span><button class="btn" ${state.index===p.steps.length-1?'disabled':''} onclick="go('${state.phase}',${state.index+1})">التالي</button></div></section><p class="footer">علامة الإنجاز يدوية فقط وليست قراءة من المعدات. هذا الدليل غير متصل بالمضخة أو PLC.</p></main></div>`}
function overview(){return `<section class="hero"><div class="eyebrow">دليل تفاعلي للمشغّل · PH04</div><h1>كل إجراء، في مكانه الصحيح.</h1><p>اتبع التسلسل، راجع الملاحظات، وأكد إنجاز كل خطوة يدوياً. النص الأصلي والإضافات الموقعية أمامك بوضوح.</p><button class="btn primary" onclick="go('prepare')">بدء تهيئة ما قبل التشغيل ←</button></section><div class="card" style="padding:20px"><h2>مسارات الإجراء</h2>${Object.entries(PHASES).map(([id,p])=>{let n=p.steps.filter(s=>state.done.has(s.id)).length;return `<div style="display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><b>${p.name}</b><div class="muted">${p.desc}</div></div><span class="tag">${n}/${p.steps.length}</span><button class="btn" onclick="go('${id}')">عرض ←</button></div>`}).join('')}</div><div class="notice safety"><b>ℹ</b><span>الدليل إرشادي ولا يرسل أوامر للمضخة. تحقق من القيم وتسميات الصمامات في الموقع قبل التنفيذ.</span></div>`}
function pairs(){let mode=state.pairMode==='stop'?'stop':'run',rows=mode==='run'?DATA.runPairs:DATA.stopPairs,r=rows[state.pairIndex];return `<div class="heading"><div><div class="eyebrow">المرجع الموقعي / موائمة الصمامات</div><h2>أزواج الموائمة</h2><p>القيم المبدئية كما وردت في المصدر، وتُعتمد بعد التحقق في الموقع.</p></div>${tag(true)}</div><div class="choice"><button class="btn ${mode==='run'?'active':''}" onclick="state.pairMode='run';state.pairIndex=0;render()">موائمة التشغيل</button><button class="btn ${mode==='stop'?'active':''}" onclick="state.pairMode='stop';state.pairIndex=0;render()">موائمة الإيقاف</button></div><div class="layout"><section class="card table-card"><h3>جدول الموائمة ${mode==='run'?'للتشغيل':'للإيقاف'}</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>الزوج</th><th>MOV-1107</th><th>MOV-FR…C</th></tr></thead><tbody>${rows.map((x,i)=>`<tr class="${i===state.pairIndex?'sel':''}" onclick="state.pairIndex=${i};render()"><th>${i?'الزوج '+i:'البداية'}</th><td>${x.manifold}%</td><td>${x.recirculation}%</td></tr>`).join('')}</tbody></table></div></section><section class="card step-card"><div class="eyebrow">${state.pairIndex?'الزوج '+state.pairIndex:'الوضع الابتدائي'}</div><h3>القيم المستهدفة</h3><div class="source"><b>MOV-1107: ${r.manifold}%</b><br><b>C: ${r.recirculation}%</b></div><p class="muted" style="line-height:2">${state.pairIndex?(mode==='run'?'افتح MOV-1107 أولاً، وبعد وصوله فعلياً أغلق C إلى قيمته، ثم انتظر استقرار الضغوط والتدفق.':'افتح C أولاً، وبعد وصوله فعلياً أغلق MOV-1107 إلى قيمته، ثم انتظر الاستقرار.'):'تحقق من الوضع الابتدائي وفق الإجراء المعتمد في الموقع.'}</p><div class="nav"><button class="btn" onclick="state.pairIndex=Math.max(0,state.pairIndex-1);render()">السابق</button><span class="muted">${state.pairIndex} / 8</span><button class="btn" onclick="state.pairIndex=Math.min(8,state.pairIndex+1);render()">التالي</button></div></section></div><div class="notice safety"><b>⚠</b><span>إذا اقتربت الضغوط من حدود الإنذار أو هبط التدفق: توقف وانتظر الاستقرار، وإن استمر الهبوط ارجع زوجاً واحداً. راجع الاختلافات المبيّنة في المستند الأصلي.</span></div>`}
function notes(){let q=state.q||'';let ns=DATA.notes.filter(n=>(n.title+' '+n.text).toLowerCase().includes(q.toLowerCase()));return `<div class="heading"><div><div class="eyebrow">المرجع التشغيلي / شروط وتنبيهات</div><h2>الملاحظات والتنبيهات</h2><p>الملاحظات كاملة مع تحذيرات السلامة.</p></div>${tag(false)}</div><input class="search" placeholder="ابحث في الملاحظات…" value="${esc(q)}" oninput="state.q=this.value;render()"><div class="note-grid">${ns.map(n=>`<article class="note" id="note-${n.id}"><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></article>`).join('')}</div>`}
function showNote(id){show('notes');setTimeout(()=>document.getElementById('note-'+id)?.scrollIntoView({behavior:'smooth'}),30)}
function toggleDone(id){state.done.has(id)?state.done.delete(id):state.done.add(id);save();render()}
function resetProgress(){if(confirm('إلغاء جميع علامات الإنجاز؟')){state.done.clear();save();render()}}
function render(){let body=state.view==='home'?overview():state.view==='pairs'?pairs():state.view==='notes'?notes():stepView();document.getElementById('app').innerHTML=header()+nav()+body}
render();
</script>
